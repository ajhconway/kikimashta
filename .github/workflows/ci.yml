name: Checks

'on':
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded PR heads cannot merge. Preserve main runs used for publication.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: kikimashta-ci
          POSTGRES_DB: kikimashta
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify database policies
        env:
          PGPASSWORD: kikimashta-ci
        run: >-
          psql -h localhost -U postgres -d kikimashta -v ON_ERROR_STOP=1
          -f supabase/tests/bootstrap.sql
          -f supabase/migrations/202611060001_sync.sql
          -f supabase/migrations/20261107032200_audio_text_attempts.sql
          -f supabase/migrations/20261108190549_contextual_attempts.sql
          -f supabase/tests/sync.sql

  validation:
    runs-on: ubuntu-24.04
    container:
      # Keep this version aligned with @playwright/test in package.json.
      # Browser OS dependencies are bundled; verification tools install separately.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    timeout-minutes: 15
    env:
      VITE_BASE_PATH: /
      SOURCE_REVISION: ${{ github.sha }}
      VITE_SUPABASE_URL: https://kikimashta-sync-test.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_kikimashta_browser_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install audio and content verification tools
        # Noble provides Python 3.12; card checks use only its standard library.
        run: |
          apt-get update && apt-get install -y --no-install-recommends ffmpeg python3
          python3 --version
      - run: npm run check

  browsers:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    timeout-minutes: 15
    env:
      VITE_BASE_PATH: /
      SOURCE_REVISION: ${{ github.sha }}
      VITE_SUPABASE_URL: https://kikimashta-sync-test.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_kikimashta_browser_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Shard each engine separately so both runners share the slower WebKit work.
      - run: npm run test:e2e -- --project=chromium --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: chromium-test-results-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - run: npm run test:e2e -- --project=webkit-mobile --shard=${{ matrix.shard }}/2
        if: ${{ !cancelled() }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: webkit-test-results-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Preserve the required status name; skipped or failed dependencies must fail it.
  checks:
    if: always()
    needs: [validation, browsers]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require all validation and browser shards
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
          BROWSERS_RESULT: ${{ needs.browsers.result }}
        run: |
          test "$VALIDATION_RESULT" = success
          test "$BROWSERS_RESULT" = success
