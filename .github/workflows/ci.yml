name: Checks

'on':
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

# Superseded PR heads cannot merge. Preserve main runs used for publication.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      tree: ${{ steps.proof.outputs.tree }}
      reuse: ${{ steps.proof.outputs.reuse }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: scripts/validated-tree.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Find successful validation of this exact source tree
        id: proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/validated-tree.mjs

  database:
    needs: candidate
    if: needs.candidate.outputs.reuse != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: kikimashta-ci
          POSTGRES_DB: kikimashta
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify database policies
        env:
          PGPASSWORD: kikimashta-ci
        run: >-
          psql -h localhost -U postgres -d kikimashta -v ON_ERROR_STOP=1
          -f supabase/tests/bootstrap.sql
          -f supabase/migrations/202611060001_sync.sql
          -f supabase/migrations/20261107032200_audio_text_attempts.sql
          -f supabase/migrations/20261108190549_contextual_attempts.sql
          -f supabase/tests/sync.sql

  validation:
    needs: candidate
    if: needs.candidate.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VITE_BASE_PATH: /
      SOURCE_REVISION: ${{ github.sha }}
      VITE_SUPABASE_URL: https://kikimashta-sync-test.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_kikimashta_browser_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install audio and content verification tools
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          python3 --version
      - run: npm run check
      - name: Share the checked browser build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-build
          path: dist/
          overwrite: true
          retention-days: 1

  browsers:
    needs: [candidate, validation]
    if: needs.candidate.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    timeout-minutes: 15
    env:
      VITE_BASE_PATH: /
      SOURCE_REVISION: ${{ github.sha }}
      VITE_SUPABASE_URL: https://kikimashta-sync-test.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_kikimashta_browser_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8.0.2
        with:
          name: browser-build
          path: dist/
      - run: npm run test:e2e -- --workers=2
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: browser-test-results
          overwrite: true
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Emit premerge proof only after all required jobs passed. Main reuses that
  # result only for the same tree; unavailable proof runs all checks again.
  checks:
    if: always()
    needs: [candidate, validation, browsers, database]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require validation or verified identical-tree reuse
        env:
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          REUSE: ${{ needs.candidate.outputs.reuse }}
          VALIDATION_RESULT: ${{ needs.validation.result }}
          BROWSERS_RESULT: ${{ needs.browsers.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
        run: |
          test "$CANDIDATE_RESULT" = success
          if [ "$REUSE" = true ]; then
            test "$GITHUB_EVENT_NAME" = push
            test "$GITHUB_REF" = refs/heads/main
            test "$VALIDATION_RESULT" = skipped
            test "$BROWSERS_RESULT" = skipped
            test "$DATABASE_RESULT" = skipped
          else
            test "$VALIDATION_RESULT" = success
            test "$BROWSERS_RESULT" = success
            test "$DATABASE_RESULT" = success
          fi
      - name: Record the validated source tree
        if: github.event_name == 'pull_request'
        env:
          TESTED_TREE: ${{ needs.candidate.outputs.tree }}
        run: |
          mkdir proof
          printf '%s\n' "$TESTED_TREE" > proof/tree.txt
      - uses: actions/upload-artifact@v7.0.2
        if: github.event_name == 'pull_request'
        with:
          name: validated-tree-${{ needs.candidate.outputs.tree }}
          path: proof/tree.txt
          overwrite: true
          retention-days: 7
