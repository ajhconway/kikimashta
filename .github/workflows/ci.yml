name: Checks

'on':
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: kikimashta-ci
          POSTGRES_DB: kikimashta
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify database policies
        env:
          PGPASSWORD: kikimashta-ci
        run: >-
          psql -h localhost -U postgres -d kikimashta -v ON_ERROR_STOP=1
          -f supabase/tests/bootstrap.sql
          -f supabase/migrations/202611060001_sync.sql
          -f supabase/tests/sync.sql

  checks:
    runs-on: ubuntu-24.04
    container:
      # Keep this version aligned with @playwright/test in package.json.
      # Browsers and OS dependencies are bundled; no apt downloads during checks.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    timeout-minutes: 15
    env:
      VITE_BASE_PATH: /
      SOURCE_REVISION: ${{ github.sha }}
      VITE_SUPABASE_URL: https://kikimashta-sync-test.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_kikimashta_browser_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install audio verification tools
        run: apt-get update && apt-get install -y ffmpeg
      - run: npm run check
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
