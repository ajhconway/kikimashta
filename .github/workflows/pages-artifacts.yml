name: Verify Pages artifacts

'on':
  pull_request:
    paths:
      - .github/workflows/pages.yml
      - .github/workflows/pages-artifacts.yml
      - docs/DEPLOYMENT.md

permissions:
  contents: read
  actions: read

jobs:
  artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Prepare fixture using the publication artifact name
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync, appendFileSync, mkdirSync, writeFileSync } from 'node:fs'
          const workflow = readFileSync('.github/workflows/pages.yml', 'utf8')
          const template = workflow.match(/^      PAGES_ARTIFACT_NAME: (.+)$/m)?.[1]
          assert.ok(template, 'publication defines an artifact name')
          const name = template.replace(/\$\{\{ github.run_id \}\}/g, process.env.GITHUB_RUN_ID)
            .replace(/\$\{\{ github.run_attempt \}\}/g, process.env.GITHUB_RUN_ATTEMPT)
          assert.equal(name, `github-pages-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`)
          assert.match(workflow, /^          name: \$\{\{ env.PAGES_ARTIFACT_NAME \}\}$/m)
          assert.match(workflow, /^          artifact_name: \$\{\{ env.PAGES_ARTIFACT_NAME \}\}$/m)
          appendFileSync(process.env.GITHUB_ENV, `PAGES_ARTIFACT_NAME=${name}\n`)
          mkdirSync('artifact-fixture')
          writeFileSync('artifact-fixture/revision.json', JSON.stringify({
            source: process.env.GITHUB_SHA,
            run: process.env.GITHUB_RUN_ID,
            attempt: process.env.GITHUB_RUN_ATTEMPT,
          }))
          JS
      - name: Upload fixture with the production packaging action
        id: upload
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: artifact-fixture
      - name: Verify unambiguous selection from retained run artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict'
          const artifacts = []
          for (let page = 1; ; page++) {
            const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}/artifacts?per_page=100&page=${page}`, {
              headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: 'application/vnd.github+json' },
            })
            assert.equal(response.status, 200)
            const data = await response.json()
            artifacts.push(...data.artifacts)
            if (data.artifacts.length < 100) break
          }
          const matches = artifacts.filter(artifact => artifact.name === process.env.PAGES_ARTIFACT_NAME)
          assert.equal(matches.length, 1, 'exactly one artifact matches the deploy-pages selection name')
          assert.equal(String(matches[0].id), process.env.EXPECTED_ID)
          console.log(JSON.stringify(artifacts.map(({ id, name }) => ({ id, name })), null, 2))
          JS
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: selected-artifact
      - name: Verify the selected artifact contains this attempt's revision
        run: |
          tar -xf selected-artifact/artifact.tar -C selected-artifact
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          assert.deepEqual(JSON.parse(readFileSync('selected-artifact/revision.json', 'utf8')), {
            source: process.env.GITHUB_SHA,
            run: process.env.GITHUB_RUN_ID,
            attempt: process.env.GITHUB_RUN_ATTEMPT,
          })
          JS
