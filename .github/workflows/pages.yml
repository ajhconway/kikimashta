name: Publish v0

'on':
  workflow_run:
    workflows: [Checks]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  # Reviewed offline feature snapshot; updating it is a separate code-reviewed change.
  OFFLINE_DEMO_REVISION: 5a86d6b95242359860d3f8cd409e4f063921f0ac

jobs:
  demo-build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.demo-artifact-name.outputs.name }}
    env:
      VITE_BASE_PATH: /offline-demo/
      VITE_STORAGE_NAMESPACE: offline-demo
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.OFFLINE_DEMO_REVISION }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build reviewed offline demo
        env:
          SOURCE_REVISION: ${{ env.OFFLINE_DEMO_REVISION }}
        run: npm run build
      - name: Identify demo artifact
        id: demo-artifact-name
        run: echo "name=offline-demo-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.demo-artifact-name.outputs.name }}
          path: dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
  deploy:
    needs: demo-build
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      VITE_BASE_PATH: /
      SOURCE_REVISION: ${{ github.event.workflow_run.head_sha }}
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build production site
        id: build
        run: npm run build
      - name: Download reviewed offline demo
        uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ needs.demo-build.outputs.artifact_name }}
          path: ${{ runner.temp }}/offline-demo-build
      - name: Preserve root and compose demo publication
        run: node scripts/offline-demo-release.mjs dist "$RUNNER_TEMP/offline-demo-build" "$OFFLINE_DEMO_REVISION"
      - uses: actions/configure-pages@v6.0.0
        with:
          enablement: true
      - name: Upload Pages artifact
        id: artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: dist
      - name: Deploy through Pages service
        id: deploy
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
      - name: Summarize publication
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          UPLOAD_RESULT: ${{ steps.artifact.outcome }}
          DEPLOY_RESULT: ${{ steps.deploy.outcome }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        run: |
          {
            echo '## Pages publication'
            echo "Source revision: \`$SOURCE_REVISION\`"
            echo "Offline demo revision: \`$OFFLINE_DEMO_REVISION\`"
            echo "Artifact: \`$PAGES_ARTIFACT_NAME\` (ID: $ARTIFACT_ID)"
            echo ''
            echo '| Build | Upload | Pages service |'
            echo '| --- | --- | --- |'
            echo "| $BUILD_RESULT | $UPLOAD_RESULT | $DEPLOY_RESULT |"
            echo ''
            if [ "$DEPLOY_RESULT" = failure ]; then
              echo 'See **Deploy through Pages service** for the last reported Pages status. After a successful build/upload, deployment_queued or syncing_files indicates waiting inside Pages.'
              echo 'For a retry, re-run the failed publication job. It rebuilds the same checked revision and uploads a new artifact for the new attempt.'
              echo 'See [publication recovery](https://github.com/ajhconway/kikimashta/blob/main/docs/DEPLOYMENT.md).'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
