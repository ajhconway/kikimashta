name: Initialize project milestones

'on':
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/initialize-milestones.yml]

permissions:
  issues: write

jobs:
  milestones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const definitions = [
              { title: 'v0', description: 'A small, enjoyable listening game with previews, untimed sessions, local progress, and GitHub Pages hosting.' },
              { title: 'Sync', description: 'Soon after v0: Supabase sign-in and cross-device sync, preserving existing history.' },
            ];
            const existing = await github.paginate(github.rest.issues.listMilestones, { ...context.repo, state: 'all', per_page: 100 });
            for (const definition of definitions) {
              const milestone = existing.find(item => item.title === definition.title)
                ?? (await github.rest.issues.createMilestone({ ...context.repo, ...definition })).data;
              core.info(JSON.stringify({ title: milestone.title, number: milestone.number, url: milestone.html_url }));
              await core.summary.addLink(milestone.title, milestone.html_url).addEOL().write();
            }
            const dependencies = [
              { issue: 2, blockedBy: [1] },
              { issue: 3, blockedBy: [1] },
              { issue: 4, blockedBy: [1] },
              { issue: 5, blockedBy: [2, 3, 4] },
              { issue: 6, blockedBy: [5] },
            ];
            const headers = { 'X-GitHub-Api-Version': '2026-03-10' };
            for (const { issue, blockedBy } of dependencies) {
              const existingDependencies = await github.paginate(
                'GET /repos/{owner}/{repo}/issues/{issue_number}/dependencies/blocked_by',
                { ...context.repo, issue_number: issue, headers }
              );
              for (const blocker of blockedBy) {
                const { data: blockerIssue } = await github.rest.issues.get({ ...context.repo, issue_number: blocker });
                if (!existingDependencies.some(item => item.id === blockerIssue.id)) {
                  await github.request(
                    'POST /repos/{owner}/{repo}/issues/{issue_number}/dependencies/blocked_by',
                    { ...context.repo, issue_number: issue, issue_id: blockerIssue.id, headers }
                  );
                }
                core.info(JSON.stringify({ issue, blockedBy: blocker }));
              }
            }
