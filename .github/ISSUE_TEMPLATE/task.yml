name: Task
description: Define a small, verifiable piece of work.
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What should be different when this task is finished?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Identify the affected area, boundaries, and relevant files or interfaces.
    validations:
      required: true
  - type: textarea
    id: done_when
    attributes:
      label: Done when
      description: List observable completion criteria as a short checklist.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: Name the primary test owner and existing coverage to extend or replace. Browser journeys need a distinct native boundary within the 24-scenario budget. For suite/CI changes record comparable counts and timings; keep real-iPhone acceptance separate. See docs/TESTING.md.
    validations:
      required: true
  - type: input
    id: dependencies
    attributes:
      label: Dependencies
      description: Link any issues or decisions that must be completed first.
    validations:
      required: false
  - type: input
    id: owner
    attributes:
      label: Owner
      description: Agent or person responsible; the coordinator can assign this later.
    validations:
      required: false
